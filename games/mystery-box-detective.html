<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mystery Box Detective</title>
<style>
    :root {
        --bg: #0a0e1a; --panel: #151b2b; --card: #1e2640;
        --text: #e2e8f0; --muted: #94a3b8;
        --green: #10b981; --red: #ef4444; --blue: #3b82f6;
        --purple: #8b5cf6; --gold: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
        background: var(--bg); color: var(--text);
        font-family: 'Segoe UI', Roboto, sans-serif;
        min-height: 100vh; display: flex; flex-direction: column;
        align-items: center; padding: 20px;
        background-image: radial-gradient(circle at 30% 20%, rgba(251,191,36,0.1), transparent 50%),
                          radial-gradient(circle at 70% 80%, rgba(139,92,246,0.1), transparent 50%);
    }
    header {
        width: 100%; max-width: 950px;
        display: flex; justify-content: space-between;
        align-items: center; margin-bottom: 20px;
    }
    .back-btn {
        background: var(--panel); color: var(--muted);
        text-decoration: none; padding: 10px 18px;
        border-radius: 10px; font-weight: bold;
        border: 1px solid rgba(255,255,255,0.1);
        font-size: 0.9rem; transition: 0.2s;
    }
    .back-btn:hover { color: white; background: #2a3450; }
    .hud { display: flex; gap: 10px; }
    .hud-box {
        background: var(--panel); padding: 10px 18px;
        border-radius: 10px; font-weight: bold; font-size: 0.9rem;
        border-bottom: 3px solid var(--gold);
    }
    .hud-box span { color: var(--gold); }

    .game-wrap {
        width: 100%; max-width: 950px;
        background: var(--panel); border-radius: 20px;
        padding: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        border: 1px solid rgba(251,191,36,0.2);
    }
    .progress-track {
        width: 100%; height: 6px; background: rgba(255,255,255,0.08);
        border-radius: 10px; margin-bottom: 25px; overflow: hidden;
    }
    .progress-fill {
        height: 100%; width: 0%;
        background: linear-gradient(90deg, #fbbf24, #ef4444);
        transition: width 0.5s;
    }

    #start-screen, #results-screen { display: none; text-align: center; }
    #start-screen.active, #results-screen.active { display: block; }
    #start-screen h1, #results-screen h1 {
        font-size: 2rem; margin-bottom: 15px;
        background: linear-gradient(135deg, #fbbf24, #ef4444);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    #start-screen p, #results-screen p {
        color: var(--muted); font-size: 1rem;
        line-height: 1.6; max-width: 640px; margin: 0 auto 20px;
    }
    .icon-big {
        font-size: 4rem; margin-bottom: 10px;
        animation: shake 2s ease-in-out infinite;
    }
    @keyframes shake { 0%,100%{transform:rotate(-5deg);} 50%{transform:rotate(5deg);} }
    .btn-primary {
        background: linear-gradient(135deg, #fbbf24, #ef4444);
        color: white; border: none; padding: 16px 45px;
        border-radius: 50px; font-size: 1.05rem; font-weight: bold;
        text-transform: uppercase; letter-spacing: 1px;
        cursor: pointer; transition: 0.2s;
        box-shadow: 0 0 25px rgba(251,191,36,0.5);
    }
    .btn-primary:hover { transform: scale(1.05); }

    #play-screen { display: none; }
    #play-screen.active { display: block; }

    .clue-card {
        background: var(--card); border-radius: 16px;
        padding: 30px; text-align: center;
        margin-bottom: 20px;
        border: 1px solid rgba(255,255,255,0.08);
    }
    .clue-emoji { font-size: 4rem; margin-bottom: 12px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.15);} }
    .clue-label {
        display: inline-block;
        background: rgba(251,191,36,0.15); color: var(--gold);
        padding: 4px 14px; border-radius: 20px;
        font-size: 0.75rem; font-weight: bold;
        text-transform: uppercase; letter-spacing: 2px;
        margin-bottom: 12px;
    }
    .clue-text {
        font-size: 1.3rem; font-weight: 600;
        line-height: 1.5;
    }

    .prompt {
        text-align: center; color: var(--muted);
        font-size: 0.9rem; text-transform: uppercase;
        letter-spacing: 2px; font-weight: bold;
        margin-bottom: 15px;
    }
    .options {
        display: grid; grid-template-columns: 1fr 1fr;
        gap: 12px; margin-bottom: 20px;
    }
    .option {
        background: var(--card); border: 2px solid rgba(255,255,255,0.1);
        padding: 18px; border-radius: 12px; cursor: pointer;
        transition: 0.2s; font-size: 0.95rem; font-weight: 600;
        text-align: center;
    }
    .option:hover { border-color: var(--gold); transform: translateY(-3px); }
    .option.correct { background: rgba(16,185,129,0.25); border-color: var(--green); }
    .option.wrong { background: rgba(239,68,68,0.25); border-color: var(--red); }

    .feedback {
        display: none; padding: 16px 20px;
        border-radius: 12px; margin-bottom: 15px;
        line-height: 1.5; font-size: 0.95rem;
    }
    .feedback.show { display: block; animation: slide 0.3s; }
    .feedback.ok { background: rgba(16,185,129,0.15); border-left: 4px solid var(--green); }
    .feedback.bad { background: rgba(239,68,68,0.15); border-left: 4px solid var(--red); }
    @keyframes slide { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }

    .next-btn {
        background: var(--purple); color: white;
        border: none; padding: 12px 30px; border-radius: 10px;
        font-weight: bold; cursor: pointer; display: none;
        font-size: 0.95rem; transition: 0.2s;
    }
    .next-btn.show { display: inline-block; }
    .next-btn:hover { background: #7c3aed; transform: scale(1.05); }

    .level-badge { font-size: 4rem; margin: 10px 0; }
    .level-title {
        font-size: 1.6rem; font-weight: bold;
        color: var(--gold); margin-bottom: 10px;
    }
    .score-big { font-size: 3rem; font-weight: 900; margin: 15px 0; }
    .action-row {
        display: flex; gap: 12px;
        justify-content: center; flex-wrap: wrap; margin-top: 20px;
    }

    @media (max-width: 600px) {
        .options { grid-template-columns: 1fr; }
        .clue-text { font-size: 1.05rem; }
        .game-wrap { padding: 20px; }
        .clue-card { padding: 20px; }
    }
</style>
</head>
<body>

<header>
    <a href="../index.html" class="back-btn">← Dashboard</a>
    <div class="hud">
        <div class="hud-box">Case: <span id="hud-q">0</span>/8</div>
        <div class="hud-box">Solved: <span id="hud-score">0</span></div>
    </div>
</header>

<div class="game-wrap">
    <div class="progress-track"><div class="progress-fill" id="prog"></div></div>

    <div id="start-screen" class="active">
        <div class="icon-big">📦</div>
        <h1>Mystery Box Detective</h1>
        <p>Become a biology detective! Read each clue carefully and identify the correct cell structure, organelle, or concept hidden in the mystery box.</p>
        <button class="btn-primary" id="start-btn">Open First Case</button>
    </div>

    <div id="play-screen">
        <div class="clue-card">
            <div class="clue-emoji" id="clue-emoji">🔍</div>
            <div class="clue-label">Clue #1</div>
            <div class="clue-text" id="clue-text"></div>
        </div>
        <div class="prompt">🔎 What am I?</div>
        <div class="options" id="options"></div>
        <div class="feedback" id="feedback"></div>
        <button class="next-btn" id="next-btn">Next Case →</button>
    </div>

    <div id="results-screen">
        <div class="level-badge" id="level-badge">🌟</div>
        <h1 id="results-title">Investigation Complete!</h1>
        <div class="level-title" id="level-title"></div>
        <div class="score-big" id="final-score">0/8</div>
        <p id="results-msg"></p>
        <div class="action-row">
            <button class="btn-primary" id="restart-btn">New Investigation</button>
            <a href="../index.html" class="back-btn" style="padding:16px 30px;">← Dashboard</a>
        </div>
    </div>
</div>
