<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cell Theory Quest · Gamified Lesson</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      background: linear-gradient(145deg, #0b1a2e 0%, #1b3b4f 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .game-container {
      max-width: 1100px;
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 48px;
      padding: 25px 30px 35px;
      box-shadow: 0 30px 40px rgba(0, 0, 0, 0.6), inset 0 1px 4px rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(120, 200, 255, 0.25);
    }

    /* Header section */
    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .title-badge {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .title-badge h1 {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #b3e9ff, #6dd5ed, #a8e6cf);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 15px rgba(109, 213, 237, 0.5);
    }

    .cell-icon {
      font-size: 2.2rem;
      filter: drop-shadow(0 0 8px #6dd5ed);
    }

    .stats {
      display: flex;
      gap: 20px;
      background: rgba(0, 20, 40, 0.7);
      padding: 10px 22px;
      border-radius: 60px;
      border: 1px solid #2d6a7a;
      box-shadow: 0 5px 0 #0a1a24;
    }

    .stat-item {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #e0f2fe;
      font-weight: 600;
      font-size: 1.2rem;
    }

    .stat-icon {
      font-size: 1.5rem;
    }

    /* Progress bar */
    .progress-area {
      margin: 5px 0 18px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 14px;
      background: #0e2a36;
      border-radius: 20px;
      box-shadow: inset 0 2px 6px #00000066;
      border: 1px solid #2a6577;
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #6dd5ed, #a8e6cf, #f6d365);
      border-radius: 20px;
      transition: width 0.5s cubic-bezier(0.34, 1.3, 0.64, 1);
      box-shadow: 0 0 12px #6dd5ed;
    }

    /* Main game board */
    .game-board {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    /* Question card */
    .question-card {
      background: rgba(10, 28, 45, 0.8);
      border-radius: 36px;
      padding: 24px 28px;
      border: 1px solid #2c7a8f;
      box-shadow: 0 12px 0 #081c26, 0 0 20px rgba(109, 213, 237, 0.2);
      transition: all 0.2s;
    }

    .question-text {
      font-size: 1.7rem;
      font-weight: 600;
      color: #e6f7ff;
      line-height: 1.4;
      margin-bottom: 20px;
      text-shadow: 0 2px 5px #00000055;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 6px;
    }

    .option-btn {
      background: #1a3c4c;
      border: 2px solid #2b6a7c;
      color: #d7f0ff;
      padding: 18px 12px;
      border-radius: 24px;
      font-size: 1.15rem;
      font-weight: 500;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: all 0.15s;
      box-shadow: 0 6px 0 #0b1f29;
      letter-spacing: 0.2px;
    }

    .option-btn:hover:not(:disabled) {
      background: #225f72;
      border-color: #6dd5ed;
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #0b1f29;
    }

    .option-btn.correct {
      background: #1c6b4b;
      border-color: #a8e6cf;
      box-shadow: 0 6px 0 #0d3b2a;
      color: white;
    }

    .option-btn.incorrect {
      background: #7a2e2e;
      border-color: #f6a5a5;
      box-shadow: 0 6px 0 #3d1414;
      color: #ffe0e0;
    }

    .option-btn:disabled {
      opacity: 0.8;
      cursor: not-allowed;
      transform: scale(0.98);
    }

    .option-letter {
      font-weight: 800;
      background: #0a2733;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-size: 1.2rem;
      color: #a8e6cf;
      flex-shrink: 0;
      border: 1px solid #4e9eb3;
    }

    /* Feedback & action row */
    .action-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .feedback {
      font-size: 1.15rem;
      font-weight: 500;
      padding: 8px 18px;
      border-radius: 40px;
      background: #0a1e28cc;
      color: #b3e9ff;
      border-left: 6px solid #6dd5ed;
      flex: 1;
      min-width: 200px;
    }

    .next-btn {
      background: linear-gradient(145deg, #2d8f9e, #1b6a7a);
      border: none;
      color: white;
      font-weight: 700;
      font-size: 1.2rem;
      padding: 14px 36px;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 7px 0 #0d3f4b, 0 0 15px #2d8f9e88;
      transition: all 0.1s;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .next-btn:active:not(:disabled) {
      transform: translateY(4px);
      box-shadow: 0 3px 0 #0d3f4b;
    }

    .next-btn:disabled {
      opacity: 0.4;
      cursor: default;
      box-shadow: 0 4px 0 #0d3f4b;
      transform: translateY(3px);
    }

    /* footer / reset */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
      color: #8abfd0;
      font-size: 0.95rem;
    }

    .reset-btn {
      background: transparent;
      border: 2px solid #2b6a7c;
      color: #b3e9ff;
      padding: 8px 22px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .reset-btn:hover {
      background: #1f4e5e;
      border-color: #6dd5ed;
    }

    /* Modal for win */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #000000bb;
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      visibility: hidden;
      opacity: 0;
      transition: 0.2s;
    }

    .modal-overlay.active {
      visibility: visible;
      opacity: 1;
    }

    .modal-card {
      background: #0f2c3a;
      border-radius: 48px;
      padding: 40px 48px;
      text-align: center;
      border: 2px solid #6dd5ed;
      box-shadow: 0 30px 40px #00000099, 0 0 60px #6dd5ed66;
      max-width: 500px;
      transform: scale(0.9);
      transition: 0.2s;
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .modal-card h2 {
      font-size: 2.5rem;
      color: #a8e6cf;
      margin-bottom: 12px;
    }

    .modal-card p {
      font-size: 1.3rem;
      color: #c2e5f2;
      margin-bottom: 28px;
    }

    .modal-card button {
      background: #6dd5ed;
      border: none;
      padding: 14px 38px;
      border-radius: 40px;
      font-weight: 800;
      font-size: 1.3rem;
      color: #07212b;
      cursor: pointer;
      box-shadow: 0 8px 0 #2a7a8a;
      transition: 0.1s;
    }

    .modal-card button:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 #2a7a8a;
    }

    @media (max-width: 700px) {
      .game-container { padding: 18px; }
      .options-grid { grid-template-columns: 1fr; }
      .question-text { font-size: 1.3rem; }
      .title-badge h1 { font-size: 1.4rem; }
      .stats { padding: 6px 12px; gap: 10px; font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div class="game-container">
    <!-- HEADER -->
    <div class="header">
      <div class="title-badge">
        <span class="cell-icon">🔬</span>
        <h1>Cell Theory Quest</h1>
      </div>
      <div class="stats">
        <div class="stat-item"><span class="stat-icon">⭐</span> <span id="scoreDisplay">0</span></div>
        <div class="stat-item"><span class="stat-icon">🧪</span> <span id="questionCounter">1/12</span></div>
      </div>
    </div>

    <!-- PROGRESS -->
    <div class="progress-area">
      <div class="progress-bar-bg">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <!-- GAME BOARD -->
    <div class="game-board">
      <div class="question-card">
        <div class="question-text" id="questionText">Loading question...</div>
        <div class="options-grid" id="optionsContainer"></div>
        <div class="action-row">
          <div class="feedback" id="feedbackMessage">Select an answer above</div>
          <button class="next-btn" id="nextBtn" disabled>Next →</button>
        </div>
      </div>
    </div>

    <!-- FOOTER -->
    <div class="footer">
      <span>🧬 Historical development & postulates</span>
      <button class="reset-btn" id="resetBtn">⟲ Restart</button>
    </div>
  </div>

  <!-- WIN MODAL -->
  <div class="modal-overlay" id="winModal">
    <div class="modal-card">
      <h2>🏆 CELL MASTER!</h2>
      <p>You've completed the Cell Theory Quest!</p>
      <p style="font-size:1.6rem; margin-bottom:28px;">Score: <span id="finalScore"></span></p>
      <button id="playAgainBtn">Play again</button>
    </div>
  </div>

  <script>
    (function() {
      // ---------- QUESTION BANK (12 questions) ----------
      const questions = [
        {
          question: "Who first observed cork under a microscope and coined the term 'cell'?",
          options: ["Anton van Leeuwenhoek", "Robert Hooke", "Matthias Schleiden", "Rudolf Virchow"],
          correct: 1,
          explanation: "Robert Hooke (1665) looked at cork and named the tiny compartments 'cells'."
        },
        {
          question: "Which scientist was the first to observe LIVING cells?",
          options: ["Robert Brown", "Theodor Schwann", "Anton van Leeuwenhoek", "Robert Hooke"],
          correct: 2,
          explanation: "Anton van Leeuwenhoek (1674) observed living cells like bacteria and protozoa."
        },
        {
          question: "Who discovered the nucleus inside a plant cell?",
          options: ["Robert Brown", "Matthias Schleiden", "Rudolf Virchow", "Theodor Schwann"],
          correct: 0,
          explanation: "Robert Brown (1831) discovered and named the nucleus."
        },
        {
          question: "Which two scientists proposed that all plants and animals are made of cells?",
          options: ["Hooke & Leeuwenhoek", "Schleiden & Schwann", "Brown & Virchow", "Virchow & Hooke"],
          correct: 1,
          explanation: "Matthias Schleiden (1838, plants) and Theodor Schwann (1839, animals)."
        },
        {
          question: "Who stated 'Omnis cellula e cellula' — all cells arise from pre-existing cells?",
          options: ["Robert Hooke", "Anton van Leeuwenhoek", "Rudolf Virchow", "Robert Brown"],
          correct: 2,
          explanation: "Rudolf Virchow (1855) proposed that cells only come from other cells."
        },
        {
          question: "Which of the following is NOT one of the three original postulates of cell theory?",
          options: [
            "All living organisms are composed of one or more cells.",
            "The cell is the basic unit of structure and function.",
            "All cells arise from pre-existing cells.",
            "Cells contain hereditary information in the form of DNA."
          ],
          correct: 3,
          explanation: "DNA as hereditary material is a MODERN addition, not an original postulate."
        },
        {
          question: "What invention was essential for the discovery of cells?",
          options: ["The telescope", "The microscope", "The stethoscope", "The barometer"],
          correct: 1,
          explanation: "The microscope allowed scientists to see the unseen world of cells."
        },
        {
          question: "Which scientist's work directly helped disprove spontaneous generation?",
          options: ["Robert Hooke", "Rudolf Virchow", "Anton van Leeuwenhoek", "Matthias Schleiden"],
          correct: 1,
          explanation: "Virchow's postulate that cells come from pre-existing cells refuted spontaneous generation."
        },
        {
          question: "What did Robert Hooke actually observe in cork?",
          options: ["Living cells", "Dead cell walls", "Nuclei", "Bacteria"],
          correct: 1,
          explanation: "Hooke saw the empty cell walls of dead cork cells."
        },
        {
          question: "Which modern addition to cell theory is correct?",
          options: [
            "Cells contain hereditary information (DNA).",
            "All cells are exactly the same size.",
            "Cells can arise from non-living matter.",
            "Only animals are made of cells."
          ],
          correct: 0,
          explanation: "Modern cell theory includes that cells contain DNA and have similar chemical composition."
        },
        {
          question: "Theodor Schwann concluded that:",
          options: ["All plants are made of cells", "All animals are made of cells", "Cells come from pre-existing cells", "The nucleus is the control center"],
          correct: 1,
          explanation: "Schwann (1839) stated that all animals are composed of cells."
        },
        {
          question: "Which sequence correctly shows the timeline of these scientists?",
          options: [
            "Hooke → Leeuwenhoek → Brown → Schleiden → Schwann → Virchow",
            "Leeuwenhoek → Hooke → Schleiden → Schwann → Brown → Virchow",
            "Hooke → Brown → Leeuwenhoek → Schwann → Schleiden → Virchow",
            "Schleiden → Schwann → Hooke → Leeuwenhoek → Brown → Virchow"
          ],
          correct: 0,
          explanation: "Hooke (1665), Leeuwenhoek (1674), Brown (1831), Schleiden (1838), Schwann (1839), Virchow (1855)."
        }
      ];

      // ---------- GAME STATE ----------
      let currentIndex = 0;
      let score = 0;
      let answered = false;
      let totalQuestions = questions.length;

      // DOM elements
      const questionText = document.getElementById('questionText');
      const optionsContainer = document.getElementById('optionsContainer');
      const feedbackMessage = document.getElementById('feedbackMessage');
      const nextBtn = document.getElementById('nextBtn');
      const scoreDisplay = document.getElementById('scoreDisplay');
      const questionCounter = document.getElementById('questionCounter');
      const progressFill = document.getElementById('progressFill');
      const resetBtn = document.getElementById('resetBtn');
      const winModal = document.getElementById('winModal');
      const finalScoreSpan = document.getElementById('finalScore');
      const playAgainBtn = document.getElementById('playAgainBtn');

      // ---------- RENDER FUNCTIONS ----------
      function renderQuestion() {
        const q = questions[currentIndex];
        questionText.textContent = q.question;
        optionsContainer.innerHTML = '';

        const letters = ['A', 'B', 'C', 'D'];
        q.options.forEach((opt, idx) => {
          const btn = document.createElement('button');
          btn.classList.add('option-btn');
          btn.innerHTML = `<span class="option-letter">${letters[idx]}</span> ${opt}`;
          btn.dataset.index = idx;
          btn.addEventListener('click', () => handleAnswer(idx, btn));
          optionsContainer.appendChild(btn);
        });

        // Reset feedback & next button
        feedbackMessage.textContent = 'Select an answer above';
        feedbackMessage.style.borderLeftColor = '#6dd5ed';
        nextBtn.disabled = true;
        answered = false;

        // Update counters
        scoreDisplay.textContent = score;
        questionCounter.textContent = `${currentIndex + 1}/${totalQuestions}`;
        updateProgress();
      }

      function handleAnswer(selectedIdx, btnElement) {
        if (answered) return;
        answered = true;

        const q = questions[currentIndex];
        const isCorrect = (selectedIdx === q.correct);

        // Disable all option buttons
        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(btn => { btn.disabled = true; });

        // Highlight correct & incorrect
        allBtns.forEach((btn, idx) => {
          if (idx === q.correct) {
            btn.classList.add('correct');
          } else if (idx === selectedIdx && !isCorrect) {
            btn.classList.add('incorrect');
          }
        });

        // Update score
        if (isCorrect) {
          score += 1;
          scoreDisplay.textContent = score;
          feedbackMessage.textContent = `✅ Correct! ${q.explanation}`;
          feedbackMessage.style.borderLeftColor = '#a8e6cf';
        } else {
          feedbackMessage.textContent = `❌ Not quite. ${q.explanation}`;
          feedbackMessage.style.borderLeftColor = '#f6a5a5';
        }

        // Enable next button
        nextBtn.disabled = false;
        updateProgress();
      }

      function updateProgress() {
        const percent = ((currentIndex + (answered ? 1 : 0)) / totalQuestions) * 100;
        progressFill.style.width = `${percent}%`;
      }

      function nextQuestion() {
        if (currentIndex < totalQuestions - 1) {
          currentIndex++;
          renderQuestion();
        } else {
          // Game finished — show modal
          finalScoreSpan.textContent = `${score} / ${totalQuestions}`;
          winModal.classList.add('active');
          // progress fill full
          progressFill.style.width = '100%';
        }
      }

      function resetGame() {
        currentIndex = 0;
        score = 0;
        answered = false;
        winModal.classList.remove('active');
        renderQuestion();
        scoreDisplay.textContent = '0';
        progressFill.style.width = '0%';
      }

      // ---------- EVENT LISTENERS ----------
      nextBtn.addEventListener('click', nextQuestion);

      resetBtn.addEventListener('click', resetGame);

      playAgainBtn.addEventListener('click', () => {
        winModal.classList.remove('active');
        resetGame();
      });

      // Close modal on overlay click (optional, but keep play again)
      winModal.addEventListener('click', (e) => {
        if (e.target === winModal) {
          // optional: keep open? we can just keep it.
        }
      });

      // Start game
      renderQuestion();
    })();
  </script>
</body>
</html>
