<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cell Theory Quest</title>
<style>
    :root {
        --bg: #0a0e1a; --panel: #151b2b; --card: #1e2640;
        --text: #e2e8f0; --muted: #94a3b8;
        --green: #10b981; --red: #ef4444; --blue: #3b82f6;
        --purple: #8b5cf6; --gold: #fbbf24;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
        background: var(--bg); color: var(--text);
        font-family: 'Segoe UI', Roboto, sans-serif;
        min-height: 100vh; display: flex; flex-direction: column;
        align-items: center; padding: 20px;
        background-image: radial-gradient(circle at 30% 20%, rgba(59,130,246,0.12), transparent 50%),
                          radial-gradient(circle at 70% 80%, rgba(139,92,246,0.12), transparent 50%);
    }
    header {
        width: 100%; max-width: 950px;
        display: flex; justify-content: space-between;
        align-items: center; margin-bottom: 20px;
    }
    .back-btn {
        background: var(--panel); color: var(--muted);
        text-decoration: none; padding: 10px 18px;
        border-radius: 10px; font-weight: bold;
        border: 1px solid rgba(255,255,255,0.1);
        font-size: 0.9rem; transition: 0.2s;
    }
    .back-btn:hover { color: white; background: #2a3450; }
    .hud { display: flex; gap: 10px; }
    .hud-box {
        background: var(--panel); padding: 10px 18px;
        border-radius: 10px; font-weight: bold; font-size: 0.9rem;
        border-bottom: 3px solid var(--blue);
    }
    .hud-box span { color: var(--gold); }

    .game-wrap {
        width: 100%; max-width: 950px;
        background: var(--panel); border-radius: 20px;
        padding: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        border: 1px solid rgba(59,130,246,0.2);
    }
    .progress-track {
        width: 100%; height: 6px; background: rgba(255,255,255,0.08);
        border-radius: 10px; margin-bottom: 25px; overflow: hidden;
    }
    .progress-fill {
        height: 100%; width: 0%;
        background: linear-gradient(90deg, #3b82f6, #8b5cf6);
        transition: width 0.5s;
    }

    #start-screen, #results-screen { display: none; text-align: center; }
    #start-screen.active, #results-screen.active { display: block; }
    #start-screen h1, #results-screen h1 {
        font-size: 2rem; margin-bottom: 15px;
        background: linear-gradient(135deg, #3b82f6, #8b5cf6);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    #start-screen p, #results-screen p {
        color: var(--muted); font-size: 1rem;
        line-height: 1.6; max-width: 640px; margin: 0 auto 20px;
    }
    .icon-big {
        font-size: 4rem; margin-bottom: 10px;
        animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.1);} }
    .btn-primary {
        background: linear-gradient(135deg, #3b82f6, #8b5cf6);
        color: white; border: none; padding: 16px 45px;
        border-radius: 50px; font-size: 1.05rem; font-weight: bold;
        text-transform: uppercase; letter-spacing: 1px;
        cursor: pointer; transition: 0.2s;
        box-shadow: 0 0 25px rgba(59,130,246,0.5);
    }
    .btn-primary:hover { transform: scale(1.05); }

    #play-screen { display: none; }
    #play-screen.active { display: block; }
    .q-tag {
        display: inline-block; background: rgba(59,130,246,0.15);
        color: #93c5fd; padding: 6px 16px; border-radius: 20px;
        font-size: 0.8rem; font-weight: bold;
        text-transform: uppercase; letter-spacing: 2px;
        margin-bottom: 15px;
    }
    .q-text {
        font-size: 1.4rem; font-weight: 600;
        margin-bottom: 22px; line-height: 1.4;
    }
    .options {
        display: grid; grid-template-columns: 1fr 1fr;
        gap: 12px; margin-bottom: 20px;
    }
    .option {
        background: var(--card); border: 2px solid rgba(255,255,255,0.1);
        padding: 18px; border-radius: 12px; cursor: pointer;
        transition: 0.2s; font-size: 0.95rem; font-weight: 600;
        text-align: center;
    }
    .option:hover { border-color: var(--blue); transform: translateY(-3px); }
    .option.correct { background: rgba(16,185,129,0.25); border-color: var(--green); }
    .option.wrong { background: rgba(239,68,68,0.25); border-color: var(--red); }

    .feedback {
        display: none; padding: 16px 20px;
        border-radius: 12px; margin-bottom: 15px;
        line-height: 1.5; font-size: 0.95rem;
    }
    .feedback.show { display: block; animation: slide 0.3s; }
    .feedback.ok { background: rgba(16,185,129,0.15); border-left: 4px solid var(--green); }
    .feedback.bad { background: rgba(239,68,68,0.15); border-left: 4px solid var(--red); }
    @keyframes slide { from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);} }

    .next-btn {
        background: var(--purple); color: white;
        border: none; padding: 12px 30px; border-radius: 10px;
        font-weight: bold; cursor: pointer; display: none;
        font-size: 0.95rem; transition: 0.2s;
    }
    .next-btn.show { display: inline-block; }
    .next-btn:hover { background: #7c3aed; transform: scale(1.05); }

    .level-badge { font-size: 4rem; margin: 10px 0; }
    .level-title {
        font-size: 1.6rem; font-weight: bold;
        color: var(--gold); margin-bottom: 10px;
    }
    .score-big { font-size: 3rem; font-weight: 900; margin: 15px 0; }
    .action-row {
        display: flex; gap: 12px;
        justify-content: center; flex-wrap: wrap; margin-top: 20px;
    }

    @media (max-width: 600px) {
        .options { grid-template-columns: 1fr; }
        .q-text { font-size: 1.15rem; }
        .game-wrap { padding: 20px; }
    }
</style>
</head>
<body>

<header>
    <a href="../index.html" class="back-btn">← Dashboard</a>
    <div class="hud">
        <div class="hud-box">Q: <span id="hud-q">0</span>/10</div>
        <div class="hud-box">Score: <span id="hud-score">0</span></div>
    </div>
</header>

<div class="game-wrap">
    <div class="progress-track"><div class="progress-fill" id="prog"></div></div>

    <div id="start-screen" class="active">
        <div class="icon-big">🔬</div>
        <h1>Cell Theory Quest</h1>
        <p>Embark on a journey through the history of cell discovery! Test your knowledge of the scientists, their contributions, and the three principles of Cell Theory.</p>
        <button class="btn-primary" id="start-btn">Start Quest</button>
    </div>

    <div id="play-screen">
        <div class="q-tag" id="q-tag">Question 1</div>
        <div class="q-text" id="q-text"></div>
        <div class="options" id="options"></div>
        <div class="feedback" id="feedback"></div>
        <button class="next-btn" id="next-btn">Next →</button>
    </div>

    <div id="results-screen">
        <div class="level-badge" id="level-badge">🌟</div>
        <h1 id="results-title">Quest Complete!</h1>
        <div class="level-title" id="level-title"></div>
        <div class="score-big" id="final-score">0/10</div>
        <p id="results-msg"></p>
        <div class="action-row">
            <button class="btn-primary" id="restart-btn">Retry Quest</button>
            <a href="../index.html" class="back-btn" style="padding:16px 30px;">← Dashboard</a>
        </div>
    </div>
</div>

<script>
const questions = [
    { q: "Who first observed cells using a homemade microscope in 1665?",
      options: ["Anton van Leeuwenhoek", "Robert Hooke", "Matthias Schleiden", "Rudolf Virchow"], correct: 1,
      explain: "Robert Hooke observed cork under a microscope and called the tiny compartments 'cells' — a term that stuck!"
    },
    { q: "What did Anton van Leeuwenhoek discover?",
      options: ["The nucleus", "Living single-celled organisms", "Cell theory", "Plant cells only"], correct: 1,
      explain: "Leeuwenhoek was the first to observe living microorganisms (bacteria, protists) using his advanced microscopes."
    },
    { q: "Which scientist concluded that ALL PLANTS are made of cells?",
      options: ["Theodor Schwann", "Matthias Schleiden", "Robert Hooke", "Rudolf Virchow"], correct: 1,
      explain: "Matthias Schleiden (1838) concluded that all plants are composed of cells."
    },
    { q: "Which scientist concluded that ALL ANIMALS are made of cells?",
      options: ["Theodor Schwann", "Matthias Schleiden", "Robert Brown", "Rudolf Virchow"], correct: 0,
      explain: "Theodor Schwann (1839) extended the cell idea to animals, concluding all animals are made of cells."
    },
    { q: "Who stated that 'all cells come from pre-existing cells'?",
      options: ["Robert Hooke", "Rudolf Virchow", "Anton van Leeuwenhoek", "Theodor Schwann"], correct: 1,
      explain: "Rudolf Virchow (1855) proposed 'Omnis cellula e cellula' — all cells arise from pre-existing cells."
    },
    { q: "What are the THREE principles of Cell Theory?",
      options: [
        "Cells have nuclei, DNA, and ribosomes",
        "All living things are made of cells; cells are the basic unit of life; all cells come from existing cells",
        "Cells are small, colorful, and alive",
        "Cells reproduce, respire, and die"
      ], correct: 1,
      explain: "The three principles: (1) All living organisms are made of cells, (2) The cell is the basic unit of life, (3) All cells arise from pre-existing cells."
    },
    { q: "Which of these is NOT a principle of Cell Theory?",
      options: [
        "All living things are composed of cells",
        "Cells are the basic unit of structure and function",
        "All cells contain a nucleus",
        "All cells come from pre-existing cells"
      ], correct: 2,
      explain: "Not all cells have a nucleus! Prokaryotes (bacteria) lack a nucleus. This is NOT part of Cell Theory."
    },
    { q: "Why was the invention of the microscope important to Cell Theory?",
      options: [
        "It helped scientists see cells for the first time",
        "It was used to cure diseases",
        "It helped with cooking",
        "It was needed to grow plants"
      ], correct: 0,
      explain: "Without microscopes, cells were invisible. The microscope made cell discovery and Cell Theory possible."
    },
    { q: "Which statement BEST describes a cell?",
      options: [
        "The largest unit of an organism",
        "The basic structural and functional unit of life",
        "Only found in animals",
        "A type of molecule"
      ], correct: 1,
      explain: "The cell is the basic structural AND functional unit of all living things — everything alive is made of cells."
    },
    { q: "What technology helped scientists confirm and expand Cell Theory?",
      options: [
        "Telescope",
        "Electron microscope",
        "Barometer",
        "Thermometer"
      ], correct: 1,
      explain: "The electron microscope (invented 1930s) revealed cell structures in incredible detail, confirming and expanding Cell Theory."
    }
];

let state = { idx: 0, score: 0, answered: false };
const D = {
    start: document.getElementById('start-screen'),
    play: document.getElementById('play-screen'),
    results: document.getElementById('results-screen'),
    startBtn: document.getElementById('start-btn'),
    restartBtn: document.getElementById('restart-btn'),
    nextBtn: document.getElementById('next-btn'),
    qTag: document.getElementById('q-tag'),
    qText: document.getElementById('q-text'),
    options: document.getElementById('options'),
    feedback: document.getElementById('feedback'),
    hudQ: document.getElementById('hud-q'),
    hudScore: document.getElementById('hud-score'),
    prog: document.getElementById('prog'),
    levelBadge: document.getElementById('level-badge'),
    levelTitle: document.getElementById('level-title'),
    finalScore: document.getElementById('final-score'),
    resultsMsg: document.getElementById('results-msg')
};

let audioCtx;
function beep(f, d, t, v) {
    try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.connect(g); g.connect(audioCtx.destination);
        o.type = t || 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(v || 0.15, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d);
        o.start(); o.stop(audioCtx.currentTime + d);
    } catch (e) {}
}
const sfx = {
    click: () => beep(500, 0.08, 'triangle', 0.1),
    ok: () => { beep(600, 0.12); setTimeout(() => beep(900, 0.15), 100); },
    bad: () => beep(150, 0.3, 'sawtooth', 0.15),
    done: () => { beep(500, 0.15); setTimeout(() => beep(700, 0.15), 150); setTimeout(() => beep(1000, 0.3), 300); }
};

function startGame() {
    state = { idx: 0, score: 0, answered: false };
    D.start.classList.remove('active');
    D.results.classList.remove('active');
    D.play.classList.add('active');
    D.hudScore.textContent = 0;
    loadQ();
}

function loadQ() {
    if (state.idx >= questions.length) return endGame();
    state.answered = false;
    const q = questions[state.idx];
    D.qTag.textContent = `Question ${state.idx + 1}`;
    D.qText.textContent = q.q;
    D.hudQ.textContent = state.idx + 1;
    D.prog.style.width = `${(state.idx / questions.length) * 100}%`;
    D.options.innerHTML = '';
    D.feedback.className = 'feedback';
    D.nextBtn.classList.remove('show');

    q.options.forEach((opt, i) => {
        const el = document.createElement('div');
        el.className = 'option';
        el.textContent = opt;
        el.addEventListener('click', () => answer(i));
        D.options.appendChild(el);
    });
}

function answer(i) {
    if (state.answered) return;
    state.answered = true;
    const q = questions[state.idx];
    const isRight = i === q.correct;

    document.querySelectorAll('.option').forEach((o, idx) => {
        o.style.pointerEvents = 'none';
        if (idx === q.correct) o.classList.add('correct');
        else if (idx === i) o.classList.add('wrong');
    });

    if (isRight) {
        sfx.ok(); state.score++;
        D.hudScore.textContent = state.score;
        D.feedback.className = 'feedback show ok';
        D.feedback.innerHTML = `✅ <strong>Correct!</strong> ${q.explain}`;
    } else {
        sfx.bad();
        D.feedback.className = 'feedback show bad';
        D.feedback.innerHTML = `❌ <strong>Not quite.</strong> ${q.explain}`;
    }

    D.nextBtn.classList.add('show');
    D.nextBtn.textContent = state.idx < questions.length - 1 ? 'Next →' : 'See Results →';
}

D.nextBtn.addEventListener('click', () => {
    sfx.click();
    state.idx++;
    if (state.idx >= questions.length) endGame();
    else loadQ();
});

function endGame() {
    D.play.classList.remove('active');
    D.results.classList.add('active');
    D.prog.style.width = '100%';
    D.finalScore.textContent = `${state.score}/${questions.length}`;
    const pct = state.score / questions.length;
    let badge, title, msg;
    if (pct >= 0.85) { badge = '🏆'; title = 'Cell Theory Master!'; msg = 'Outstanding! You know the history and principles of Cell Theory like a true scientist.'; }
    else if (pct >= 0.6) { badge = '🔬'; title = 'Rising Researcher'; msg = 'Good work! Review the scientists and their contributions to strengthen your understanding.'; }
    else { badge = '🧫'; title = 'Curious Explorer'; msg = 'Keep exploring! Cell Theory is the foundation of biology — you will get there with practice.'; }
    D.levelBadge.textContent = badge;
    D.levelTitle.textContent = title;
    D.resultsMsg.textContent = msg;
    sfx.done();
}

D.startBtn.addEventListener('click', () => { sfx.click(); startGame(); });
D.restartBtn.addEventListener('click', () => { sfx.click(); startGame(); });
</script>
</body>
</html>
